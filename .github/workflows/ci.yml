name: CI

on:
  push:
  pull_request:

# Least privilege: the checks only read the repository (D-090).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm --filter @lo-fi-rocket/app build
      # The MCP server as users download it: one file and the Claude Desktop extension (plan 0062).
      - run: pnpm --filter @lo-fi-rocket/mcp build
      - run: pnpm --filter @lo-fi-rocket/mcp smoke
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @lo-fi-rocket/app e2e
