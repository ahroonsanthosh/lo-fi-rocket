name: Dependency review

# Blocks a pull request that adds a dependency with a known high or critical vulnerability
# (plan 0061 step 1, D-090). Free for public repositories.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
